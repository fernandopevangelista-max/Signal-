<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal — Registre seu sinal</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    #particle-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #0a0a0f;
    }

    .container {
      position: relative; z-index: 2;
      width: 100%; max-width: 640px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }

    .logo-mark {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--indigo), var(--cyan));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px rgba(99,102,241,.4);
    }

    .logo-mark svg { width: 30px; height: 30px; color: #fff; }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px; font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--indigo), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .tagline { color: var(--text-muted); font-size: 14px; }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
    }

    .form-title {
      font-size: 17px; font-weight: 600;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .2px;
      border-radius: var(--radius);
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--indigo), var(--cyan));
      color: #fff;
      transition: all .3s;
      margin-top: 8px;
    }
    .submit-btn:hover { box-shadow: 0 0 28px rgba(99,102,241,.45); transform: translateY(-2px); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Success state */
    .success-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .success-overlay.show { display: flex; }

    .checkmark-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(52,211,153,.1);
      border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      animation: pop .4s cubic-bezier(.175,.885,.32,1.275);
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .checkmark-circle svg { width: 38px; height: 38px; color: var(--green); }

    .success-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px; font-weight: 700;
      margin-bottom: 8px;
    }

    .success-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

    .form-section { display: block; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 520px) {
      .form-card { padding: 24px 18px; }
      .row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="particle-bg"></canvas>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-mark">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 20.25h.008v.008H12v-.008z"/>
          </svg>
        </div>
        <span class="logo-text">Signal</span>
      </div>
      <p class="tagline">Sua voz move a operação</p>
    </header>

    <div class="form-card">
      <div class="form-section" id="formSection">
        <h2 class="form-title">Novo registro</h2>
        <form id="signalForm" novalidate>

          <div class="row-2">
            <div class="field">
              <label for="atendente">Nome do atendente *</label>
              <input id="atendente" name="atendente" type="text" class="input" placeholder="Seu nome completo" required maxlength="100" />
            </div>
            <div class="field">
              <label for="matricula">Matrícula *</label>
              <input id="matricula" name="matricula" type="text" class="input" placeholder="Ex: 00123456" required maxlength="50" />
            </div>
          </div>

          <div class="row-2">
            <div class="field">
              <label for="segmento">Segmento *</label>
              <select id="segmento" name="segmento_id" class="select" required>
                <option value="">Carregando...</option>
              </select>
            </div>
            <div class="field">
              <label for="tipo">Tipo de registro *</label>
              <select id="tipo" name="tipo" class="select" required>
                <option value="">Carregando...</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="titulo">Título *</label>
            <input id="titulo" name="titulo" type="text" class="input" placeholder="Resumo em uma frase" required maxlength="100" />
            <div class="char-counter"><span id="tituloCount">0</span>/100</div>
          </div>

          <div class="field">
            <label for="descricao">Descrição detalhada *</label>
            <textarea id="descricao" name="descricao" class="textarea" placeholder="Descreva com detalhes o que aconteceu, quando e qual o impacto." required maxlength="1000" rows="5"></textarea>
            <div class="char-counter"><span id="descricaoCount">0</span>/1000</div>
          </div>

          <div class="field">
            <label for="sugestao">Sugestão de solução <span style="font-weight:400;color:var(--text-muted)">(opcional)</span></label>
            <textarea id="sugestao" name="sugestao" class="textarea" placeholder="Se tiver uma ideia de como resolver, compartilhe." maxlength="500" rows="3"></textarea>
            <div class="char-counter"><span id="sugestaoCount">0</span>/500</div>
          </div>

          <div class="field">
            <label>Nível de impacto *</label>
            <div class="radio-group">
              <label class="radio-label" data-value="baixo">
                <input type="radio" name="impacto" value="baixo" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
                Baixo
              </label>
              <label class="radio-label" data-value="medio">
                <input type="radio" name="impacto" value="medio" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/></svg>
                Médio
              </label>
              <label class="radio-label" data-value="alto">
                <input type="radio" name="impacto" value="alto" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                Alto
              </label>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Enviar sinal</button>
        </form>
      </div>

      <div class="success-overlay" id="successOverlay">
        <div class="checkmark-circle">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="success-title">Sinal enviado!</h2>
        <p class="success-sub" id="successMsg">Obrigado, seu registro foi recebido.</p>
        <button class="btn btn-ghost" id="newRecordBtn">Enviar outro registro</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/assets/app.js"></script>
  <script>
    (function () {
      // ── Perlin noise ──────────────────────────────────────────────────────────
      const perm = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
      const p = new Array(512);
      for (let i = 0; i < 256; i++) p[256 + i] = p[i] = perm[i];

      function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      function lerp(t, a, b) { return a + t * (b - a); }
      function grad(hash, x, y, z) {
        const h = hash & 15, u = h < 8 ? x : y;
        const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }
      function noise3(x, y, z) {
        const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
        x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
        const u = fade(x), v = fade(y), w = fade(z);
        const A = p[X]+Y, AA = p[A]+Z, AB = p[A+1]+Z, B = p[X+1]+Y, BA = p[B]+Z, BB = p[B+1]+Z;
        return lerp(w,
          lerp(v, lerp(u, grad(p[AA],x,y,z),   grad(p[BA],x-1,y,z)),
                  lerp(u, grad(p[AB],x,y-1,z),  grad(p[BB],x-1,y-1,z))),
          lerp(v, lerp(u, grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1)),
                  lerp(u, grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1))));
      }

      // ── Canvas setup ──────────────────────────────────────────────────────────
      const canvas = document.getElementById('particle-bg');
      const ctx = canvas.getContext('2d', { alpha: true });

      const PARTICLE_COUNT = 2000;
      const NOISE_INTENSITY = 0.003;
      const SIZE_MIN = 0.5, SIZE_MAX = 2;

      let particles = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function makeParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * (SIZE_MAX - SIZE_MIN) + SIZE_MIN,
          vx: 0, vy: 0,
          life: Math.random() * 100,
          maxLife: 100 + Math.random() * 50,
        };
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(makeParticle());

      function animate() {
        // Dark mode trail: semi-transparent dark fill
        ctx.fillStyle = 'rgba(10, 10, 15, 0.12)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const t = Date.now() * 0.0001;

        for (const p of particles) {
          p.life += 1;
          if (p.life > p.maxLife) {
            p.life = 0;
            p.x = Math.random() * canvas.width;
            p.y = Math.random() * canvas.height;
          }

          const opacity = Math.sin((p.life / p.maxLife) * Math.PI) * 0.15;
          const n = noise3(p.x * NOISE_INTENSITY, p.y * NOISE_INTENSITY, t);
          const angle = n * Math.PI * 4;
          p.vx = Math.cos(angle) * 2;
          p.vy = Math.sin(angle) * 2;
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;

          ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
</html>
