<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal — Registre seu sinal</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    #shader-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .container {
      position: relative; z-index: 2;
      width: 100%; max-width: 640px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }

    .logo-mark {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--indigo), var(--cyan));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-mark svg { width: 22px; height: 22px; color: #fff; }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px; font-weight: 700;
      background: linear-gradient(90deg, var(--indigo), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .tagline { color: var(--text-muted); font-size: 14px; }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
    }

    .form-title {
      font-size: 17px; font-weight: 600;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .2px;
      border-radius: var(--radius);
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--indigo), var(--cyan));
      color: #fff;
      transition: all .3s;
      margin-top: 8px;
    }
    .submit-btn:hover { box-shadow: 0 0 28px rgba(99,102,241,.45); transform: translateY(-2px); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Success state */
    .success-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .success-overlay.show { display: flex; }

    .checkmark-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(52,211,153,.1);
      border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      animation: pop .4s cubic-bezier(.175,.885,.32,1.275);
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .checkmark-circle svg { width: 38px; height: 38px; color: var(--green); }

    .success-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px; font-weight: 700;
      margin-bottom: 8px;
    }

    .success-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

    .form-section { display: block; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 520px) {
      .form-card { padding: 24px 18px; }
      .row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="shader-bg"></canvas>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-mark">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <span class="logo-text">Signal</span>
      </div>
      <p class="tagline">Sua voz move a operação</p>
    </header>

    <div class="form-card">
      <div class="form-section" id="formSection">
        <h2 class="form-title">Novo registro</h2>
        <form id="signalForm" novalidate>

          <div class="row-2">
            <div class="field">
              <label for="atendente">Nome do atendente *</label>
              <input id="atendente" name="atendente" type="text" class="input" placeholder="Seu nome completo" required maxlength="100" />
            </div>
            <div class="field">
              <label for="matricula">Matrícula *</label>
              <input id="matricula" name="matricula" type="text" class="input" placeholder="Ex: 00123456" required maxlength="50" />
            </div>
          </div>

          <div class="row-2">
            <div class="field">
              <label for="segmento">Segmento *</label>
              <select id="segmento" name="segmento_id" class="select" required>
                <option value="">Carregando...</option>
              </select>
            </div>
            <div class="field">
              <label for="tipo">Tipo de registro *</label>
              <select id="tipo" name="tipo" class="select" required>
                <option value="">Selecione</option>
                <option value="melhoria">Sugestão de melhoria de processo</option>
                <option value="impacto">Problema/impacto no dia</option>
                <option value="erro_sistema">Erro de sistema/ferramenta</option>
                <option value="outro">Outro</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="titulo">Título *</label>
            <input id="titulo" name="titulo" type="text" class="input" placeholder="Resumo em uma frase" required maxlength="100" />
            <div class="char-counter"><span id="tituloCount">0</span>/100</div>
          </div>

          <div class="field">
            <label for="descricao">Descrição detalhada *</label>
            <textarea id="descricao" name="descricao" class="textarea" placeholder="Descreva com detalhes o que aconteceu, quando e qual o impacto." required maxlength="1000" rows="5"></textarea>
            <div class="char-counter"><span id="descricaoCount">0</span>/1000</div>
          </div>

          <div class="field">
            <label for="sugestao">Sugestão de solução <span style="font-weight:400;color:var(--text-muted)">(opcional)</span></label>
            <textarea id="sugestao" name="sugestao" class="textarea" placeholder="Se tiver uma ideia de como resolver, compartilhe." maxlength="500" rows="3"></textarea>
            <div class="char-counter"><span id="sugestaoCount">0</span>/500</div>
          </div>

          <div class="field">
            <label>Nível de impacto *</label>
            <div class="radio-group">
              <label class="radio-label" data-value="baixo">
                <input type="radio" name="impacto" value="baixo" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
                Baixo
              </label>
              <label class="radio-label" data-value="medio">
                <input type="radio" name="impacto" value="medio" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/></svg>
                Médio
              </label>
              <label class="radio-label" data-value="alto">
                <input type="radio" name="impacto" value="alto" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                Alto
              </label>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Enviar sinal</button>
        </form>
      </div>

      <div class="success-overlay" id="successOverlay">
        <div class="checkmark-circle">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="success-title">Sinal enviado!</h2>
        <p class="success-sub" id="successMsg">Obrigado, seu registro foi recebido.</p>
        <button class="btn btn-ghost" id="newRecordBtn">Enviar outro registro</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/assets/app.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('shader-bg');
      const gl = canvas.getContext('webgl');
      if (!gl) return;

      const vsSource = `
        attribute vec4 aVertexPosition;
        void main() { gl_Position = aVertexPosition; }
      `;

      const fsSource = `
        precision highp float;
        uniform vec2 iResolution;
        uniform float iTime;

        const float overallSpeed = 0.2;
        const float gridSmoothWidth = 0.015;
        const float axisWidth = 0.05;
        const float majorLineWidth = 0.025;
        const float minorLineWidth = 0.0125;
        const float majorLineFrequency = 5.0;
        const float minorLineFrequency = 1.0;
        const float scale = 5.0;
        const vec4 lineColor = vec4(0.4, 0.2, 0.8, 1.0);
        const float minLineWidth = 0.01;
        const float maxLineWidth = 0.2;
        const float lineSpeed = 1.0 * overallSpeed;
        const float lineAmplitude = 1.0;
        const float lineFrequency = 0.2;
        const float warpSpeed = 0.2 * overallSpeed;
        const float warpFrequency = 0.5;
        const float warpAmplitude = 1.0;
        const float offsetFrequency = 0.5;
        const float offsetSpeed = 1.33 * overallSpeed;
        const float minOffsetSpread = 0.6;
        const float maxOffsetSpread = 2.0;
        const int linesPerGroup = 16;

        #define drawCircle(pos, radius, coord) smoothstep(radius + gridSmoothWidth, radius, length(coord - (pos)))
        #define drawSmoothLine(pos, halfWidth, t) smoothstep(halfWidth, 0.0, abs(pos - (t)))
        #define drawCrispLine(pos, halfWidth, t) smoothstep(halfWidth + gridSmoothWidth, halfWidth, abs(pos - (t)))
        #define drawPeriodicLine(freq, width, t) drawCrispLine(freq / 2.0, width, abs(mod(t, freq) - (freq) / 2.0))

        float random(float t) {
          return (cos(t) + cos(t * 1.3 + 1.3) + cos(t * 1.4 + 1.4)) / 3.0;
        }

        float getPlasmaY(float x, float horizontalFade, float offset) {
          return random(x * lineFrequency + iTime * lineSpeed) * horizontalFade * lineAmplitude + offset;
        }

        void main() {
          vec2 fragCoord = gl_FragCoord.xy;
          vec2 uv = fragCoord / iResolution.xy;
          vec2 space = (fragCoord - iResolution.xy / 2.0) / iResolution.x * 2.0 * scale;

          float horizontalFade = 1.0 - (cos(uv.x * 6.28) * 0.5 + 0.5);
          float verticalFade = 1.0 - (cos(uv.y * 6.28) * 0.5 + 0.5);

          space.y += random(space.x * warpFrequency + iTime * warpSpeed) * warpAmplitude * (0.5 + horizontalFade);
          space.x += random(space.y * warpFrequency + iTime * warpSpeed + 2.0) * warpAmplitude * horizontalFade;

          vec4 lines = vec4(0.0);
          vec4 bgColor1 = vec4(0.1, 0.1, 0.3, 1.0);
          vec4 bgColor2 = vec4(0.3, 0.1, 0.5, 1.0);

          for (int l = 0; l < linesPerGroup; l++) {
            float normalizedLineIndex = float(l) / float(linesPerGroup);
            float offsetTime = iTime * offsetSpeed;
            float offsetPosition = float(l) + space.x * offsetFrequency;
            float rand = random(offsetPosition + offsetTime) * 0.5 + 0.5;
            float halfWidth = mix(minLineWidth, maxLineWidth, rand * horizontalFade) / 2.0;
            float offset = random(offsetPosition + offsetTime * (1.0 + normalizedLineIndex)) * mix(minOffsetSpread, maxOffsetSpread, horizontalFade);
            float linePosition = getPlasmaY(space.x, horizontalFade, offset);
            float line = drawSmoothLine(linePosition, halfWidth, space.y) / 2.0 + drawCrispLine(linePosition, halfWidth * 0.15, space.y);

            float circleX = mod(float(l) + iTime * lineSpeed, 25.0) - 12.0;
            vec2 circlePosition = vec2(circleX, getPlasmaY(circleX, horizontalFade, offset));
            float circle = drawCircle(circlePosition, 0.01, space) * 4.0;

            line = line + circle;
            lines += line * lineColor * rand;
          }

          vec4 fragColor = mix(bgColor1, bgColor2, uv.x);
          fragColor *= verticalFade;
          fragColor.a = 1.0;
          fragColor += lines;
          gl_FragColor = fragColor;
        }
      `;

      function compileShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { gl.deleteShader(s); return null; }
        return s;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

      const posLoc = gl.getAttribLocation(prog, 'aVertexPosition');
      const resLoc = gl.getUniformLocation(prog, 'iResolution');
      const timeLoc = gl.getUniformLocation(prog, 'iTime');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      window.addEventListener('resize', resize);
      resize();

      const startTime = Date.now();
      function render() {
        const t = (Date.now() - startTime) / 1000;
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(prog);
        gl.uniform2f(resLoc, canvas.width, canvas.height);
        gl.uniform1f(timeLoc, t);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(posLoc);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
