<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal — Registre seu sinal</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    #signal-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #0a0a0f;
    }

    .container {
      position: relative; z-index: 2;
      width: 100%; max-width: 640px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }

    .logo-mark {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--indigo), var(--cyan));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px rgba(99,102,241,.4);
    }

    .logo-mark svg { width: 30px; height: 30px; color: #fff; }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px; font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--indigo), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .tagline { color: var(--text-muted); font-size: 14px; }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
    }

    .form-title {
      font-size: 17px; font-weight: 600;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .2px;
      border-radius: var(--radius);
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--indigo), var(--cyan));
      color: #fff;
      transition: all .3s;
      margin-top: 8px;
    }
    .submit-btn:hover { box-shadow: 0 0 28px rgba(99,102,241,.45); transform: translateY(-2px); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Success state */
    .success-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .success-overlay.show { display: flex; }

    .checkmark-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(52,211,153,.1);
      border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      animation: pop .4s cubic-bezier(.175,.885,.32,1.275);
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .checkmark-circle svg { width: 38px; height: 38px; color: var(--green); }

    .success-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px; font-weight: 700;
      margin-bottom: 8px;
    }

    .success-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

    .form-section { display: block; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 520px) {
      .form-card { padding: 24px 18px; }
      .row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="signal-bg"></canvas>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-mark">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 20.25h.008v.008H12v-.008z"/>
          </svg>
        </div>
        <span class="logo-text">Signal</span>
      </div>
      <p class="tagline">Sua voz move a operação</p>
    </header>

    <div class="form-card">
      <div class="form-section" id="formSection">
        <h2 class="form-title">Novo registro</h2>
        <form id="signalForm" novalidate>

          <div class="row-2">
            <div class="field">
              <label for="atendente">Nome do atendente *</label>
              <input id="atendente" name="atendente" type="text" class="input" placeholder="Seu nome completo" required maxlength="100" />
            </div>
            <div class="field">
              <label for="matricula">Matrícula *</label>
              <input id="matricula" name="matricula" type="text" class="input" placeholder="Ex: 00123456" required maxlength="50" />
            </div>
          </div>

          <div class="row-2">
            <div class="field">
              <label for="segmento">Segmento *</label>
              <select id="segmento" name="segmento_id" class="select" required>
                <option value="">Carregando...</option>
              </select>
            </div>
            <div class="field">
              <label for="tipo">Tipo de registro *</label>
              <select id="tipo" name="tipo" class="select" required>
                <option value="">Carregando...</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="titulo">Título *</label>
            <input id="titulo" name="titulo" type="text" class="input" placeholder="Resumo em uma frase" required maxlength="100" />
            <div class="char-counter"><span id="tituloCount">0</span>/100</div>
          </div>

          <div class="field">
            <label for="descricao">Descrição detalhada *</label>
            <textarea id="descricao" name="descricao" class="textarea" placeholder="Descreva com detalhes o que aconteceu, quando e qual o impacto." required maxlength="1000" rows="5"></textarea>
            <div class="char-counter"><span id="descricaoCount">0</span>/1000</div>
          </div>

          <div class="field">
            <label for="sugestao">Sugestão de solução <span style="font-weight:400;color:var(--text-muted)">(opcional)</span></label>
            <textarea id="sugestao" name="sugestao" class="textarea" placeholder="Se tiver uma ideia de como resolver, compartilhe." maxlength="500" rows="3"></textarea>
            <div class="char-counter"><span id="sugestaoCount">0</span>/500</div>
          </div>

          <div class="field">
            <label>Nível de impacto *</label>
            <div class="radio-group">
              <label class="radio-label" data-value="baixo">
                <input type="radio" name="impacto" value="baixo" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
                Baixo
              </label>
              <label class="radio-label" data-value="medio">
                <input type="radio" name="impacto" value="medio" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/></svg>
                Médio
              </label>
              <label class="radio-label" data-value="alto">
                <input type="radio" name="impacto" value="alto" />
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                Alto
              </label>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Enviar sinal</button>
        </form>
      </div>

      <div class="success-overlay" id="successOverlay">
        <div class="checkmark-circle">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="success-title">Sinal enviado!</h2>
        <p class="success-sub" id="successMsg">Obrigado, seu registro foi recebido.</p>
        <button class="btn btn-ghost" id="newRecordBtn">Enviar outro registro</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/assets/app.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('signal-bg');
    const ctx = canvas.getContext('2d');

    // ── Config ────────────────────────────────────────────────────────────────
    const NODE_COUNT   = 72;
    const CONNECT_DIST = 160;
    const MOUSE_REPEL  = 120;
    const SPEED        = 0.4;
    const NODE_R       = 2.2;
    const PULSE_SPEED  = 3.5;   // px per frame
    const PULSE_MAX    = 340;   // max radius before fade
    const INDIGO = [99, 102, 241];
    const CYAN   = [34, 211, 238];

    // ── State ─────────────────────────────────────────────────────────────────
    let W, H;
    let mouse = { x: -9999, y: -9999 };
    let pulses = [];  // { x, y, r, alpha }
    let nodes  = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Nodes ─────────────────────────────────────────────────────────────────
    function makeNode() {
      const angle = Math.random() * Math.PI * 2;
      const spd   = (0.3 + Math.random() * 0.7) * SPEED;
      return {
        x:  Math.random() * W,
        y:  Math.random() * H,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        pulse: 0,          // local glow intensity 0→1
        pulseDir: 1,
      };
    }
    for (let i = 0; i < NODE_COUNT; i++) nodes.push(makeNode());

    // ── Mouse ─────────────────────────────────────────────────────────────────
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', e => {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    // Click / tap → ripple pulse
    function spawnPulse(x, y) {
      pulses.push({ x, y, r: 0, alpha: 1 });
    }
    window.addEventListener('click',     e => spawnPulse(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => spawnPulse(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

    // ── Color helpers ─────────────────────────────────────────────────────────
    function lerpColor(a, b, t) {
      return [
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t),
      ];
    }
    function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`; }

    // ── Mouse cursor glow ─────────────────────────────────────────────────────
    function drawMouseGlow() {
      if (mouse.x < 0) return;
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, MOUSE_REPEL * 1.4);
      g.addColorStop(0,   'rgba(99,102,241,0.18)');
      g.addColorStop(0.5, 'rgba(34,211,238,0.07)');
      g.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, MOUSE_REPEL * 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── Main loop ─────────────────────────────────────────────────────────────
    function frame() {
      ctx.clearRect(0, 0, W, H);

      // Mouse glow
      drawMouseGlow();

      // ── Update & draw connections ─────────────────────────────────────────
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > CONNECT_DIST) continue;

          const t    = dist / CONNECT_DIST;         // 0=close 1=far
          const fade = 1 - t;                        // opacity

          // Color interpolates indigo→cyan along canvas x axis
          const cx = (a.x + b.x) / 2 / W;
          const col = lerpColor(INDIGO, CYAN, cx);

          // Brighten connections near mouse
          const mdx = mouse.x - (a.x + b.x) / 2;
          const mdy = mouse.y - (a.y + b.y) / 2;
          const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
          const boost = mdist < MOUSE_REPEL * 2 ? 0.5 * (1 - mdist / (MOUSE_REPEL * 2)) : 0;

          ctx.strokeStyle = rgba(col, Math.min(1, fade * 0.55 + boost));
          ctx.lineWidth   = fade * 1.2 + boost * 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      // ── Update & draw nodes ───────────────────────────────────────────────
      for (const n of nodes) {
        // Drift
        n.x += n.vx;
        n.y += n.vy;

        // Bounce on edges
        if (n.x < 0)  { n.x = 0;  n.vx *= -1; }
        if (n.x > W)  { n.x = W;  n.vx *= -1; }
        if (n.y < 0)  { n.y = 0;  n.vy *= -1; }
        if (n.y > H)  { n.y = H;  n.vy *= -1; }

        // Mouse repulsion
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const md = Math.sqrt(dx * dx + dy * dy);
        if (md < MOUSE_REPEL) {
          const force = (1 - md / MOUSE_REPEL) * 1.8;
          n.vx += (dx / md) * force * 0.12;
          n.vy += (dy / md) * force * 0.12;
          // Clamp speed
          const spd = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
          if (spd > SPEED * 4) { n.vx = n.vx / spd * SPEED * 4; n.vy = n.vy / spd * SPEED * 4; }
        }

        // Gentle friction to avoid drift build-up
        n.vx *= 0.998;
        n.vy *= 0.998;

        // Ambient pulse flicker
        n.pulse += 0.025 * n.pulseDir;
        if (n.pulse > 1) { n.pulse = 1; n.pulseDir = -1; }
        if (n.pulse < 0) { n.pulse = 0; n.pulseDir = 1; }

        // Draw node
        const cx = n.x / W;
        const col = lerpColor(INDIGO, CYAN, cx);
        const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, NODE_R * 5);
        glow.addColorStop(0,   rgba(col, 0.5 + n.pulse * 0.4));
        glow.addColorStop(0.4, rgba(col, 0.15));
        glow.addColorStop(1,   rgba(col, 0));
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(n.x, n.y, NODE_R * 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = rgba(col, 0.85 + n.pulse * 0.15);
        ctx.beginPath();
        ctx.arc(n.x, n.y, NODE_R, 0, Math.PI * 2);
        ctx.fill();
      }

      // ── Ripple pulses ─────────────────────────────────────────────────────
      for (let i = pulses.length - 1; i >= 0; i--) {
        const pu = pulses[i];
        pu.r += PULSE_SPEED;
        pu.alpha = (1 - pu.r / PULSE_MAX) * 0.8;

        if (pu.alpha <= 0) { pulses.splice(i, 1); continue; }

        // Outer ring
        ctx.strokeStyle = `rgba(99,102,241,${pu.alpha.toFixed(3)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(pu.x, pu.y, pu.r, 0, Math.PI * 2);
        ctx.stroke();

        // Inner ring (offset)
        if (pu.r > 30) {
          ctx.strokeStyle = `rgba(34,211,238,${(pu.alpha * 0.5).toFixed(3)})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.arc(pu.x, pu.y, pu.r - 30, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
